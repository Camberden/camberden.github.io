<!DOCTYPE html>
<html lang="en-US">
<!-- Hi there! :V -->

<head>
	<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="referrer" content="no-referrer" />
	<link rel="shortcut icon" href="..images/cmbr-sig.svg">
	<link rel="stylesheet" type="text/css" href="styles.css" media="screen" />
	<link rel="stylesheet" type="text/css" href="blog.css" media="screen" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.12.6/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

	<script src="/htmx.js"></script>
	<script src="/cmbr.js"></script>

	<title>Chrispy's Blog</title>
</head>

<body data-theme="dark">

	<main class="index-grid">

		<div class="signature-div">
			<img id="signature" src="/images/cmbr-sig-transform.svg" alt="cmbr">
		</div>

		<div class="index-grid-reduced">
			<div id="camberden-div">
				<h1 id="camberden" lang="en-US">camberden</h1>
			</div>
		</div>

		<div id="info-div">

			<div id="page-info">
				<p>
					Welcome to the camberden corner.<br>
					I'm the author, <i>Chrispy,</i> and this site is now my relegated to... something else.<br>
					I'll dress it up a little. Make it simple for you.<br>
					Expeditious regards,<br>
					<span class="chrispyfruit-1">🍇 Chrispy</span>
				</p>
			</div>

			<div id="info-div-frame">
				<div id="info-div-background">
				</div>
			</div>

		</div>

		<hr class="hr-hkri-gradient">

		<div class="sections-links" hx-get="/sections.html" hx-swap="innerHTML" hx-target="#sections-target"
			hx-trigger="load">
			<div id="sections-target"></div>
		</div>
		<hr class="hr-hkri-gradient">


		<!-- <hr class="hr-groove-bottom"> -->
		<footer class="index-footer chrispyfruit-1">
			<p id="footer-text">Made with ♡ by Chrispy</p>
			<p>Last updated on <span x-ref="update" id="latest-update"></span></p>
			<p lang="jp"><span id="japanese-date"></span></p>
		</footer>

	</main>

	<script src="action.js"></script>
</body>

</html>
