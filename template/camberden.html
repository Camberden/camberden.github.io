<h1 id='camberden' lang='en-US' x-data="{
	randomizeMonicker: function() {
		const monickers = ['camberden', '観葉伝', 'カンバデン', `}*'<'('H'[';<'`];
		const m = Math.random();
		if (m <= 0.2) {
			$el.lang = 'jp';
			$el.setAttribute('style', 'font-family: Yusei Magic;');
			$el.innerHTML = monickers[1];
		} else if (m <= 0.4) {
			$el.lang = 'jp';
			$el.setAttribute('style', 'font-family: Yusei Magic;');
			$el.innerHTML = monickers[2];
		} else if (m <= 0.6) {
			$el.removeAttribute('font-family');
			$el.lang = 'la-fonipa';
			$el.innerHTML = monickers[0].replace('c', 'k');
			$el.classList.add('eremoran-kiptascript');
			$el.setAttribute('style', 'font-family: eremoran-kiptascript;');
		} else if (m <= 0.8) {
			$el.innerHTML = monickers[3];
		} else {
			$el.innerHTML = monickers[0];
		}
		$el.style.opacity = '100%';
	},

}" x-effect="randomizeMonicker();">camberden</h1>
