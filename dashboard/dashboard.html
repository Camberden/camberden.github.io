<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- <meta name="referrer" content="no-referrer" /> -->
	<link rel="shortcut icon" href="../images/cmbr-sig.svg">
	<link rel="stylesheet" type="text/css" href="../styles.css" media="screen" />
	<link rel="stylesheet" type="text/css" href="../mediaquery.css" media="screen" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css">
	<script src="https://unpkg.com/@popperjs/core@2"></script>
	<script src="https://unpkg.com/tippy.js@6"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/1.11/simplemde.min.css">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="https://cdn.jsdelivr.net/simplemde/1.11/simplemde.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.12.6/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://unpkg.com/alpinejs-fetch@latest/dist/api.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>

	<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
	<script src="/htmx.js"></script>
	<script src="/cmbr.js"></script>

	<title>Chrispy's Dashboard</title>
</head>

<body data-theme="dark" x-data="{
			utilitiesView: false,
			toggleUtilitiesView: function() {
				this.utilitiesView = !this.utilitiesView;
				console.log('triggered utilitiesView: ' + this.utilitiesView);
			},
		}" hx-get="../compon/tube.html" hx-target="this" hx-trigger="load" hx-swap="beforeend">

	<nav id="nav" hx-get="/nav.html" hx-target="#nav" hx-trigger="load" hx-swap="innerHTML" x-bg></nav>

	<main class="dashboard-grid" x-data=" { }">
		<div class="dashboard-item">
			<div hx-get="../template/interval-panel.html" hx-trigger="intersect" hx-target="this" hx-swap="innerHTML">
			</div>
			<div hx-get="../template/days-and-weeks-lived.html" hx-trigger="intersect" hx-target="this"
				hx-swap="innerHTML">
			</div>

		</div>
		<div class="dashboard-item" hx-get="../template/expenses.html" hx-trigger="load" hx-target="this"
			hx-swap="innerHTML"></div>
		<div class="dashboard-item" hx-get="../template/reeducation.html" hx-trigger="load" hx-target="this"
			hx-swap="innerHTML"></div>
		<div class="dashboard-item" hx-get="../template/calendar.html" hx-trigger="load" hx-target="this"
			hx-swap="innerHTML">
		</div>
		<div class="dashboard-item" hx-get="../template/step-pay-plan.html" hx-trigger="intersect" hx-target="this"
			hx-swap="innerHTML"></div>
		<div class="dashboard-item" hx-get="../template/pension-calculator.html" hx-trigger="intersect" hx-target="this"
			hx-swap="innerHTML"></div>
		<div class="dashboard-item" hx-get="../template/reserves-calculator.html" hx-trigger="intersect"
			hx-target="this" hx-swap="innerHTML"></div>

	</main>


	<!-- * SPLIDE * -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.0.7/dist/css/splide.min.css">
	<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.0.7/dist/js/splide.min.js"></script>

	<style>
		.splide__pagination__page.is-active {
			background: #333;
		}
	</style>

	<div x-data="{
        init() {
            new Splide(this.$refs.splide, {
                perPage: 2,
                gap: '0.5rem',
                breakpoints: {
                    640: {
                        perPage: 1,
                    },
                },
            }).mount()
        },
    }">
		<section x-ref="splide" class="splide px-14" aria-label="Splide/Alpine.js Carousel Example">
			<div class="splide__track">
				<ul class="splide__list">
					<li class="splide__slide flex flex-col items-center justify-center pb-8">
						<img class="w-full" src="../assets/travel-photos/photo-nara-jp-1.jpeg" alt="placeholder image">
					</li>

					<li class="splide__slide flex flex-col items-center justify-center pb-8">
						<img class="w-full" src="../assets/travel-photos/photo-nara-jp-2.jpeg" alt="placeholder image">
					</li>

					<li class="splide__slide flex flex-col items-center justify-center pb-8">
						<img class="w-full" src="../assets/travel-photos/photo-nv-us-1.jpeg" alt="placeholder image">
					</li>
					<li class="splide__slide flex flex-col items-center justify-center pb-8">
						<img class="w-full" src="../assets/travel-photos/photo-nv-us-2.jpeg" alt="placeholder image">
					</li>
					<li class="splide__slide flex flex-col items-center justify-center pb-8">
						<img class="w-full" src="../assets/travel-photos/photo-nv-us-3.jpeg" alt="placeholder image">
					</li>
					<li class="splide__slide flex flex-col items-center justify-center pb-8">
						<img class="w-full" src="../assets/travel-photos/photo-nv-us-4.jpeg" alt="placeholder image">
					</li>
					<li class="splide__slide flex flex-col items-center justify-center pb-8">
						<img class="w-full" src="../assets/travel-photos/photo-nv-us-5.jpeg" alt="placeholder image">
					</li>
					<li class="splide__slide flex flex-col items-center justify-center pb-8">
						<img class="w-full" src="../assets/travel-photos/photo-nv-us-6.jpeg" alt="placeholder image">
					</li>
					<li class="splide__slide flex flex-col items-center justify-center pb-8">
						<img class="w-full" src="../assets/travel-photos/photo-nv-us-7.jpeg" alt="placeholder image">
					</li>

					<li class="splide__slide flex flex-col items-center justify-center pb-8">
						<img class="w-full" src="../assets/travel-photos/photo-pa-us-1.jpeg" alt="placeholder image">
					</li>
				</ul>
			</div>
		</section>
	</div>
</body>

</html>
