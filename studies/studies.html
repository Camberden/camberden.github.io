<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- <meta name="referrer" content="no-referrer" /> -->
	<link rel="shortcut icon" href="..images/cmbr-sig.svg">
	<link rel="stylesheet" type="text/css" href="../styles.css" media="screen" />
	<link rel="stylesheet" type="text/css" href="../blog/blog.css" media="screen" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/1.11/simplemde.min.css">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="https://cdn.jsdelivr.net/simplemde/1.11/simplemde.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.12.6/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://unpkg.com/alpinejs-fetch@latest/dist/api.min.js"></script>

	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
	<script src="/htmx.js"></script>
	<script src="/cmbr.js"></script>

	<title>Chrispy's Studies</title>
</head>

<body data-theme="dark" x-data="{
			utilitiesView: false,
			toggleUtilitiesView: function() {
				this.utilitiesView = !this.utilitiesView;
				console.log('triggered utilitiesView: ' + this.utilitiesView);
			},
		}" hx-get="../compon/tube.html" hx-target="this" hx-trigger="load" hx-swap="beforeend">

	<nav id="nav" hx-get="/nav.html" hx-target="#nav" hx-trigger="load" hx-swap="innerHTML" x-bg></nav>

	<main id="blog-main" class="flex-grid-cmbr" x-data="{
		studyView: 'poems',
		}">

		<!-- % LEFT -->

		<!-- % CENTER -->
		<article class="blog-item" id="blog-post-articles" x-data="{
			studyFrames: {},
		}" x-effect="studyFrames = await CMBRutil.connectCMBRjson(['studyDocs']);">
			<button class="trigger-box" @click="studyView = 'poems'" x-show="studyView !== 'poems'"
				x-text="'Poem View'"></button>
			<button class="trigger-box" @click="studyView = 'frames'" x-show="studyView !== 'frames'"
				x-text="'Frame View'"></button>
			<button class="trigger-box" @click="studyView = 'quizzes'" x-show="studyView !== 'quizzes'"
				x-text="'Quiz View'"></button>
			<button class="trigger-box" @click="toggleUtilitiesView()" x-text="'Utilities'"></button>
			<div x-show="studyView === 'poems'">
				<div class="blog-post-header">
					<button id="previous-bp" class="trigger-box" @click="previousPoem();">Previous</button>
					<button id="next-bp" class="trigger-box" @click="nextPoem();">Next</button>
				</div>
				<hr class="hr-cmbr-dark-gradient">

				<div class="poem" style="user-select: none;">
					<div class="writing" id="fortyping">
					</div>
				</div>

			</div>
			<select id="frame-select" @change="$refs.studyFrameSource.src = $el.value" x-show="studyView === 'frames'">
				<template x-for="(item, index) in studyFrames" :key="index">
					<option x-text="item">
					</option>
				</template>
			</select>
			<div x-show="studyView === 'frames'">
				<iframe x-ref="studyFrameSource" src="../assets/reference-docs/refdoc-mat171-transformations.pdf"
					width="600" height="600"></iframe>
			</div>


			<div x-show="studyView === 'quiz'">
			</div>

			<hr class="hr-push-down">




		</article>

		<!-- % RIGHT -->


		<!-- <ins x-text="tubeVids.length"></ins> -->




	</main>
	<div id="footer-sections" x-data x-transition>
		<span x-show="utilitiesView" class="modal-close" @click="toggleUtilitiesView();">⨂</span>
		<div x-show="!utilitiesView">
			<h1 class="h1-lamp" camberlamp>Utilities</h1>
		</div>

		<div x-show="utilitiesView" class="flex-grid-cmbr" style="align-items: center; justify-items: center;
	align-content: center;">
			<div id="mdeditor-handle" class="typingfield" style="text-align: left;" x-data="{
						value: '',
						init() {
							let editor = CMBRutil.md();
							editor.value(this.value);
							editor.codemirror.on('change', ()=> {
								this.value = editor.value();
							});
							editor.codemirror.on('keyup', ()=> {
								typingTest();
							});
						},
					}">

				<input x-ref="mdinput" id="sampleTypingField" type='hidden' name='mdinput' :value="value" />
				<textarea x-ref="editor" value=""></textarea>
			</div> <!-- % END MARKDOWN EDITOR HANDLE % -->

		</div>
	</div>

	<!-- <script src="blog-data.js"></script> -->
	<script src="../studies/studies.js"></script>

</body>

</html>
