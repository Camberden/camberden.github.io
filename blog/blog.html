<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- <meta name="referrer" content="no-referrer" /> -->
	<link rel="shortcut icon" href="..images/cmbr-sig.svg">
	<link rel="stylesheet" type="text/css" href="../styles.css" media="screen" />
	<link rel="stylesheet" type="text/css" href="../mediaquery.css" media="screen" />
	<link rel="stylesheet" type="text/css" href="blog.css" media="screen" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.12.6/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://unpkg.com/alpinejs-fetch@latest/dist/api.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
	<!-- <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script> -->
	<script src="/htmx.js"></script>
	<script src="/cmbr.js"></script>

	<title>Chrispy's Blog</title>
</head>

<body data-theme="dark" hx-get="../compon/tube.html" hx-target="this" hx-trigger="load" hx-swap="beforeend">

	<nav id="nav" hx-get="/nav.html" hx-target="#nav" hx-trigger="load" hx-swap="innerHTML" x-bg></nav>

	<main id="blog-main" class="cmbr-grid" x-data="{
			modifyingBp: false,
			toggleModifyingBp: function() { 
				this.modifyingBp = !this.modifyingBp;
			},
			currentBp: currentlyReadingNumber,
			currentlyReadingChanged: function() {
				return this.currentBp === currentlyReadingNumber;
			},
			bpBody: '',
			duckedItem: false,

		}" x-effect="bpBody = await $get(currentlyReading.body);">

		<!-- % LEFT -->
		<div class="cmbr-item cmbr-item-left" id="blog-post-listings">
			<div class="blog-post-header">
				<select id="blog-post-year-select">
					<option value="all-years">All Years</option>
				</select>
			</div>
			<!-- <br> -->
			<hr class="hr-cmbr-dark-gradient">
			<hr class="hr-groove-top">

			<ul id="blog-post-list">

			</ul>

			<hr class="hr-groove-bottom">
			<hr class="hr-cmbr-dark-gradient">

		</div>
		<!-- % CENTER -->
		<article id="blog-post-articles" class="cmbr-item cmbr-item-center blogging-font">
			<div class="blog-post-header">
				<button id="previous-bp" class="cmbr-button blog-button">Previous</button>
				<button id="next-bp" class="cmbr-button blog-button">Next</button>
			</div>
			<hr class="hr-cmbr-dark-gradient">
			<div>
				<div>
					<p id="blog-post-date">August 11th, 2024</p>
					<p id="blog-post-location">Chapel Hill Suite</p>
					<p id="blog-post-time">2200HRS</p>
				</div>
				<!-- <div 
					:hx-get="currentlyReading.body" hx-trigger="load" hx-target="#blog-post-body" hx-swap="innerHTML"
					@htmx:before-swap="marked.parse(currentlyReading.body)"
					> -->
				<div>
					<p id="blog-post-body" x-effect="marked.parse($el.innerHTML);">
					</p>
					<hr class="hr-cmbr-gradient">
				</div>
			</div>


		</article>

		<!-- % RIGHT -->
		<div class="cmbr-item cmbr-item-right" id="blog-post-media">
			<!-- <span class="vt323" id="auth-status"></span> -->
			<button x-show="duckedItem" class="trigger-box" @click="duckedItem =! duckedItem;">
				<span x-text="'Display'"></span>
			</button>
			<div x-show="!duckedItem" x-transition>
				<div class="blog-post-header">
					<h3><span id="displayed-post" style="font-size: 1.5rem;"></span></h3>
					<h4><span id="blog-post-title" style="font-size: 1.2rem;"></span></h4>
				</div>
				<hr class="hr-cmbr-dark-gradient">
				<hr class="hr-groove-top">

				<div id="blog-post-tags">
				</div>

				<div id="blog-map"></div>

				<div id="blog-photos">
				</div>

				<div id="blog-music">
					<div id="player"></div>
				</div>

				<hr class="hr-groove-bottom">
				<hr class="hr-cmbr-dark-gradient">
			</div>
		</div>

	</main>

	<script src="blog-data.js"></script>
	<script src="blog.js"></script>

</body>

</html>
