<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- <meta name="referrer" content="no-referrer" /> -->
	<link rel="shortcut icon" href="../images/cmbr-sig.svg">
	<link rel="stylesheet" type="text/css" href="../styles.css" media="screen" />
	<link rel="stylesheet" type="text/css" href="../mediaquery.css" media="screen" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/1.11/simplemde.min.css">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="https://cdn.jsdelivr.net/simplemde/1.11/simplemde.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@imacrayon/alpine-ajax@0.12.6/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
	<script defer src="https://unpkg.com/alpinejs-fetch@latest/dist/api.min.js"></script>

	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
	<script src="/htmx.js"></script>
	<script src="/cmbr.js"></script>

	<title>Happy Veteran's Day!</title>
</head>

<body data-theme="light" x-data="{
		}" hx-get="../compon/tube.html" hx-target="this" hx-trigger="load" hx-swap="beforeend" style="height:200vh;">

	<nav id="nav" hx-get="/nav.html" hx-target="#nav" hx-trigger="load" hx-swap="innerHTML" x-bg></nav>

	<main class=" grid-col-4-1" style="width: 100%;" x-data=" {
		talking: true,
		utterance: '',
		linesRead: false,
		lines: [
			'Hello there, Fox!',
			'I want to wish you a Happy Veteran\'s Day!',
			'You probably hear it a lot, but here it is:',
			'Thanks so so much for your service!',
			'and for all the sacrifices entailed...',
			'and for all the hardships endured...',
			'and of course, for your Honor',
			'Courage',
			'and Committment.',
			'You have and are making a meaningful difference.',
			'Don\'t you doubt it!',
			'Cheers, to my favorite Sailor.',


		],
		loadLine: function(line) {
			this.utterance = '';
			let i = 0;
			console.log(line);
			this.talking = true;
			const charpaste = setInterval(() => {
				this.utterance += line[i];
				i++;
				if (this.utterance.length === line.length) {
					this.talking = false;
					clearInterval(charpaste);
				}
			}, 100);
		},
		rainOn: false,
		
	 }">

		<!-- <div class="cmbr-item cmbr-item-center"> -->

		<div style="position: fixed; top:5%; width: 100%; text-align: center; z-index:10">

			<div class=" grid-col-1-3-1-1"
				style="background-color: var(--cmbr-blass); border: 0.5rem inset black; justify-content: center;">
				<div style=" border: 0.5rem inset black;">
					<div style="font-size: 5rem;">🇺🇸</div>
				</div>


				<div
					style="text-align: center; align-content: center; justify-content: center; border: 0.5rem inset black;">
					<!-- <div style="font-size: 5rem; animation: stagger-signature ease-in-out infinite 10s">🇺🇸</div> -->
					<div class="marker" style="color: skyblue; font-size: 1.5rem;" x-text="utterance">
					</div>
				</div>

				<div x-data="{counter: 0,}" style="border: 0.5rem inset black; flex-flow: row nowrap;"
					x-init="loadLine(lines[counter]); counter++;">
					<button class="cmbr-button" x-text="'⇐'" @click="counter--; loadLine(lines[counter]);"
						:disabled="talking" style="left: 0;" x-show="counter <= 1;"></button>
					<button class="cmbr-button" x-text="'⇒'" x-show="counter !== lines.length"
						@click="loadLine(lines[counter]); counter++; counter === lines.length ? linesRead=true : console.log();"
						:disabled="talking" style="right: 0;"></button>
					<button x-show="linesRead" class="cmbr-button" x-text="'↺'"
						@click="counter = 0; loadLine(lines[counter]);" :disabled="talking"></button>
					<button x-show="linesRead" class="cmbr-button" x-text="'🌧️'" @click="rainOn =! rainOn"></button>

					<div style="border: 0.5rem inset black; flex-flow: row nowrap;">
						<hr class="hr-cmbr-legacy-gradient">
						<audio preload="auto"
							x-effect="$el.currentTime = '0'; setTimeout(() => { console.log('Testing.') }, 2000)();"
							controls>
							<source src="../assets/music-tracks/music-opening-thematic-statement.mp4" type="audio/mpeg">
						</audio>
					</div>
				</div>

				<div style="border: 0.5rem inset black;">
					<div style="border: 0.5rem inset black;">
						<img src="../assets/artifacts/chrispy-headshot-2.jpg" width="100%" height="100%">
						<hr class="hr-cmbr-legacy-gradient">
					</div>
					<div class="chrispy" style="font-size: 1rem; ">
						<h1>Chrispy</h1>
						<img x-show="talking" width="200%" height="100%" style="bottom: 0;"
							src="../images/squares-fade.svg" alt="loading..." cmbr-loading />
					</div>


				</div>

			</div>
		</div>

		<!-- <div vid-paused></div> -->

		<!-- % outerHTML will Rain the Screen! -->
		<div x-show="rainOn" hx-get="../template/rainfall.html" hx-target="this" hx-trigger="load" hx-swap="innerHTML">
		</div>

		<div style="
			bottom:30%;
			display: flex;
			box-sizing: border-box;
			position: fixed;
			width: 100%;
			height: 30%;
			z-index: 80;">
			<div class="grid-row-1-1-1" style="width: 50rem;" x-show="linesRead" x-cloak>
				<div class="grid-col-1-1">
					<span class="h1-lamp" style="
				text-shadow: #ffcc00 2rem 1rem 5rem;
				animation: 8s linear infinite shadow-fade;">boom~</span>
					<span class="h1-lamp" style="
				text-shadow: #ff8000 5rem 2rem 5rem;
				animation: 15s linear infinite shadow-fade;">boo ff~</span>
				</div>
				<div class="grid-col-1-1-1" style="width: 50rem;">
					<span class="h1-lamp" style="
				text-shadow: #dec460 2rem 1rem 5rem;
				animation: 9s linear infinite shadow-fade;">bang!</span>
					<span class="h1-lamp" style="
				text-shadow: #da4e28 3rem 6rem 3rem;
				animation: 10s linear infinite shadow-fade;">bunf~</span>
					<span class="h1-lamp" style="
				text-shadow: #d74b14 2rem 1rem 5rem;
				animation: 10s linear infinite shadow-fade;">bewm.</span>
				</div>
				<div class="grid-col-1">
					<span class="h1-lamp" style="
				text-shadow: #dec460 2rem 1rem 5rem;
				animation: 5s linear infinite shadow-fade;">boom!</span>
				</div>
			</div>
		</div>

		<footer style="
			bottom:0;
			display: flex;
			box-sizing: border-box;
			position: fixed;
			width: 100%;
			height: 25%;
			z-index: 80;
			background-color: blue;
			background-image: var(--mosky-4);">

			<div class="grid-row-1-1-1" style="width: 50rem;">
				<div class="grid-col-1-1">
					<div class="miniship"
						:style="linesRead ? 'animation: toAndFro infinite 8s ease-in-out;' : console.log()">🇺🇸</div>
					<div class="miniship" style="animation: toAndFro infinite 7s ease-in-out;">🇺🇸</div>
				</div>
				<div class="grid-col-2-1">
					<div class="miniship"
						:style="linesRead ? 'animation: toAndFro infinite 8s ease-in-out;' : console.log()">🇺🇸</div>
					<div class="miniship" style="animation: toAndFro infinite 8s ease-in-out;"
						@click="linesRead = true;">🇺🇸</div>
				</div>
				<div class="grid-col-1-1-1">
					<div class="miniship"
						:style="linesRead ? 'animation: toAndFro infinite 8s ease-in-out;' : console.log()">🇺🇸</div>
					<div class="miniship" style="animation: toAndFro infinite 5s ease-in-out;">🇺🇸</div>
					<div class="miniship" style="animation: toAndFro infinite 7s ease-in-out;">🇺🇸</div>
				</div>
			</div>

		</footer>


	</main>


</body>

</html>
