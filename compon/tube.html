<div x-data="{
	tubeVideoInput: '',
	tubeVid: '',
	tubeVids: {},
	getTubeVidId: function(str) {
		return str.split('v=')[1];
	},
	onYouTubeIframeAPIReady: function() {
		console.log('test');
		player = new YT.Player('player', {
			height: '100%',
			width: '100%',
			videoId: this.tubeVideo,
			playerVars: {
				'playsinline': 0,
				'disablekb': 1,
				'autoplay': 1,
				'fs': 1,
				'hl': 'ja'
			},
			events: {
				'onReady': this.onPlayerReady,
				'onStateChange': this.onPlayerStateChange,
			}
		});
	},
	onPlayerReady: function(event) {
		console.log('test');
		event.target.this.playVideo();
	},
	onPlayerStateChange: function(event) {
		console.log('test');
		if (event.data == this.YT.PlayerState.PLAYING && !done) {
			setTimeout(console.info('Sixty-five-thousand.'), 65000);
			done = true;
		}
	},
	pauseVideo: function() {
		this.player.pauseVideo();
		console.log('test');
	},
	pauseVideoOnConsole: function() {
		(setTimeout(() => {
			// console.clear();
			console.groupCollapsed('Pausing Blog Post ' + tubeVideoNumber + ' YouTube Player');
			console.info('Audio: ' + this.player.videoTitle);
			pauseVideo();
			console.groupEnd();
		}, 1000));
	},
	}" x-init=""
	x-effect="tubeVids = await CMBRutil.connectCMBRjson(['tubeVideos']); $nextTick(() => { tubeVid = tubeVids[0] });">
</div>
